apiVersion: batch/v1
kind: Job
metadata:
  generateName: agentlink-integration-
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: agentlink-integration
    spec:
      restartPolicy: Never
      containers:
        - name: test
          # The launcher substitutes the freshly built image digest.
          image: AGENTLINK_TEST_IMAGE
          imagePullPolicy: IfNotPresent
